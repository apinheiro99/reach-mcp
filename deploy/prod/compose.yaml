# Production Server. It runs an image already built by deploy/prod/build-image.mjs; Compose never builds from source.
# The three host paths below must already exist (Docker would create a missing path as a directory) and be set by the operator:
#   REACH_CONFIG_FILE    a file the container user (uid 1000) can read and write: the Server stores its configuration there
#   REACH_PROPOSAL_FILE  a file the container user can read and write
#   REACH_LOG_DIR        a directory the container user can write
# The container is named reach-server (override with REACH_CONTAINER_NAME); the Compose project name stays the controller's.
# Data (MCP) and admin are separate listeners and separate mappings; both default to host loopback only.
services:
  reach-server:
    container_name: ${REACH_CONTAINER_NAME:-reach-server}
    image: ${REACH_IMAGE:?set REACH_IMAGE to the tag produced by build-image.mjs}
    restart: unless-stopped
    volumes:
      - ${REACH_CONFIG_FILE:?absolute path of the config file}:/run/reach/config.json
      - ${REACH_PROPOSAL_FILE:?absolute path of the proposal file}:/run/reach/proposal.json
      - ${REACH_LOG_DIR:?absolute path of the log directory}:/var/log/reach
    ports:
      - "${REACH_DATA_BIND:-127.0.0.1}:${REACH_DATA_PORT:-8787}:8787"
      - "${REACH_ADMIN_BIND:-127.0.0.1}:${REACH_ADMIN_PORT:-8788}:8788"
