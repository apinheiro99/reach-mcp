# Baseline CI: every validation job is blocking. Validation logic lives in package.json scripts.
# Every validation job publishes a compact always-on summary artifact, including on failure.
# The tag stage is self-contained and records the aggregate result directly in this repository.
# Tag contract: vYYYY.MM.NNNNNN[-fail].
# GitLab requirement: allow CI_JOB_TOKEN to push to this same repository.
# Production delivery: the release is built only from a passing default-branch pipeline and deployed by a manual job; the logic lives in
# deploy/prod/deploy.mjs, run locally by the Instance Runner tagged docker-prod on the PROD host (no SSH, no target variables).
image: node:24-bookworm

stages:
  - validate
  - tag
  - release
  - deploy

default:
  tags:
    - scope
  before_script:
    - npm ci

.branch-push-only:
  rules:
    # Result tags are pushed by the tag stage: a tag pipeline never runs validation or tagging again.
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

.validation-summary:
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-summary/

"Public Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.mjs "Public Release Check" npm run check:public-surface

"Lint":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.mjs "Lint" npm run lint

"Type Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.mjs "Type Check" npm run typecheck

"Automated Tests":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.mjs "Automated Tests" npm test

"Package Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.mjs "Package Check" npm run check:package

"Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.mjs "Release Check" npm run check:release

.ci-tag:
  stage: tag
  image: node:24-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    # The server certificate may be internal: git trusts only what the runner hands it (verification is never turned off).
    - 'if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'TAG="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; if [ "$CI_TAG_RESULT" = "fail" ]; then TAG="${TAG}-fail"; fi; export TAG'
    - git tag "$TAG" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$TAG"

ci-tag-green:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: pass
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success

ci-tag-red:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: fail
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure

.default-branch-push:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feature/task-37-prod-runner-local-ci"'

"Build Release":
  extends: .default-branch-push
  stage: release
  needs:
    - "Public Release Check"
    - "Lint"
    - "Type Check"
    - "Automated Tests"
    - "Package Check"
    - "Release Check"
  script:
    - node scripts/release.mjs build --build-id "$CI_COMMIT_SHORT_SHA" --repository-commit "$CI_COMMIT_SHA" --out release
    - node scripts/release.mjs verify --out release
  artifacts:
    expire_in: 14 days
    paths:
      - release/

.deploy-job:
  stage: deploy
  before_script: []
  interruptible: false
  resource_group: production
  tags:
    - docker-prod
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - deploy-evidence/

"Deploy Production":
  extends: .deploy-job
  needs:
    - job: "Build Release"
      artifacts: true
  script:
    - npm ci
    - export REACH_ROOT="$HOME/reach-prod"
    - mkdir -p "$REACH_ROOT/config" "$REACH_ROOT/logs" deploy-evidence
    - node deploy/prod/deploy.mjs deploy --release release --state "$REACH_ROOT/state" --config "$REACH_ROOT/config/server.json" --proposal "$REACH_ROOT/config/proposal.json" --logs "$REACH_ROOT/logs" --evidence deploy-evidence/evidence.json
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "feature/task-37-prod-runner-local-ci"'
      when: manual

"Rollback Production":
  extends: .deploy-job
  needs: []
  script:
    - npm ci
    - export REACH_ROOT="$HOME/reach-prod"
    - mkdir -p "$REACH_ROOT/logs" deploy-evidence
    - node deploy/prod/deploy.mjs rollback --state "$REACH_ROOT/state" --logs "$REACH_ROOT/logs" --evidence deploy-evidence/evidence.json
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
