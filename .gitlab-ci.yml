# Baseline CI: every validation job is blocking. Validation logic lives in package.json scripts.
# Every validation job publishes a compact always-on summary artifact, including on failure.
# The tag stage is self-contained and records the aggregate result directly in this repository.
# Tag contract: vYYYY.MM.NNNNNN[-fail].
# GitLab requirement: allow CI_JOB_TOKEN to push to this same repository.
# GitHub publication: after a green default-branch pipeline, the "Publish GitHub" job pushes the exact tested commit and its green tag using host-local private credentials (REACH_PRIVATE_PATH); a publication failure blocks Deploy Production.
# Production delivery: the release is built only from a passing default-branch or Task-branch pipeline. The default branch deploys automatically after it; a Task branch deploys by itself
# as Deploy Candidate, for the exact pipeline SHA (live acceptance before merge); rollback stays manual; the logic lives in
# deploy/prod/deploy.ts, run locally by the Instance Runner tagged docker-prod on the PROD host (no SSH, no target variables).
image: node:24-bookworm

stages:
  - validate
  - tag
  - release
  - publish
  - deploy

default:
  tags:
    - scope
  before_script:
    - npm ci

.branch-push-only:
  rules:
    # Result tags are pushed by the tag stage: a tag pipeline never runs validation or tagging again.
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

.validation-summary:
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-summary/

"Public Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.ts "Public Release Check" npm run check:public-surface

"Lint":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.ts "Lint" npm run lint

"Type Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.ts "Type Check" npm run typecheck

"Automated Tests":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.ts "Automated Tests" npm test

"Package Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.ts "Package Check" npm run check:package

"Release Check":
  extends:
    - .branch-push-only
    - .validation-summary
  stage: validate
  script:
    - node scripts/validation-summary.ts "Release Check" npm run check:release

.ci-tag:
  stage: tag
  image: node:24-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    # The server certificate may be internal: git trusts only what the runner hands it (verification is never turned off).
    - 'if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'TAG="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; if [ "$CI_TAG_RESULT" = "fail" ]; then TAG="${TAG}-fail"; fi; export TAG'
    - git tag "$TAG" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$TAG"

ci-tag-green:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: pass
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success

ci-tag-red:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: fail
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure

.release-push:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature\/task-/'

"Build Release":
  extends: .release-push
  stage: release
  needs:
    - "Public Release Check"
    - "Lint"
    - "Type Check"
    - "Automated Tests"
    - "Package Check"
    - "Release Check"
  script:
    # The release identity is the version the green tag job gives this very pipeline (same grammar as .ci-tag), so the footer shows the Git tag.
    - VERSION="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"
    - node scripts/release.ts build --build-id "$VERSION" --repository-commit "$CI_COMMIT_SHA" --out release
    - node scripts/release.ts verify --out release
  artifacts:
    expire_in: 14 days
    paths:
      - release/

# Publication of the exact tested commit and its green tag: default-branch push only, never a tag pipeline or a Task branch. Credentials live only under the host-local private root.
"Publish GitHub":
  stage: publish
  tags:
    - docker-prod
  variables:
    GIT_DEPTH: "0"
  before_script: []
  interruptible: false
  needs:
    - "ci-tag-green"
    - job: "Build Release"
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - node scripts/git-ci/publish-github.ts

.deploy-job:
  stage: deploy
  before_script: []
  interruptible: false
  resource_group: production
  tags:
    - docker-prod
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - deploy-evidence/

# The one deployment script: the release built by "Build Release" for this pipeline's SHA goes through the controller.
.deploy-release:
  extends: .deploy-job
  needs:
    - job: "Build Release"
      artifacts: true
  script:
    - npm ci
    - export REACH_ROOT="$HOME/reach-prod"
    - mkdir -p deploy-evidence
    - node deploy/prod/deploy.ts deploy --release release --state "$REACH_ROOT/state" --private-path "$REACH_PRIVATE_PATH" --tunnel-binary "$REACH_ROOT/bin/tunnel-client" --tunnel-dir "$REACH_ROOT/tunnel" --admin-bind "$REACH_ADMIN_BIND" --admin-allow-from "$REACH_ADMIN_ALLOW_FROM" --evidence deploy-evidence/evidence.json

"Deploy Production":
  extends: .deploy-release
  # Deployment follows a successful publication of the same pipeline.
  needs:
    - job: "Build Release"
      artifacts: true
    - job: "Publish GitHub"
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Live acceptance of one validated Task-branch SHA before merge (PO order: no button): runs by itself only once "Build Release" (which needs every validation job) has passed.
"Deploy Candidate":
  extends: .deploy-release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature\/task-/'

"Rollback Production":
  extends: .deploy-job
  needs: []
  script:
    - npm ci
    - export REACH_ROOT="$HOME/reach-prod"
    - mkdir -p deploy-evidence
    - node deploy/prod/deploy.ts rollback --state "$REACH_ROOT/state" --private-path "$REACH_PRIVATE_PATH" --tunnel-binary "$REACH_ROOT/bin/tunnel-client" --tunnel-dir "$REACH_ROOT/tunnel" --admin-bind "$REACH_ADMIN_BIND" --admin-allow-from "$REACH_ADMIN_ALLOW_FROM" --evidence deploy-evidence/evidence.json
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    # PO order: no deploy ever waits for a click. Rollback stays available as a manual button but must never leave the pipeline blocked in "manual".
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
