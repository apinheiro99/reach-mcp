# Baseline CI: every validation job is blocking. Validation logic lives in package.json scripts.
# The tag stage is self-contained and records the aggregate result directly in this repository.
# Tag contract: vYYYY.MM.NNNNNN[-fail].
# GitLab requirement: allow CI_JOB_TOKEN to push to this same repository.
image: node:24-bookworm

stages:
  - validate
  - tag

default:
  tags:
    - scope
  before_script:
    - npm ci

.branch-push-only:
  rules:
    # Result tags are pushed by the tag stage: a tag pipeline never runs validation or tagging again.
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

"Public Release Check":
  extends: .branch-push-only
  stage: validate
  script:
    - npm run check:public-surface

"Lint":
  extends: .branch-push-only
  stage: validate
  script:
    - npm run lint

"Type Check":
  extends: .branch-push-only
  stage: validate
  script:
    - npm run typecheck

"Automated Tests":
  extends: .branch-push-only
  stage: validate
  script:
    - npm test

"Package Check":
  extends: .branch-push-only
  stage: validate
  script:
    - npm run check:package

.ci-tag:
  stage: tag
  image: node:24-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    # The server certificate may be internal: git trusts only what the runner hands it (verification is never turned off).
    - 'if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"; fi'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - 'TAG="v$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y.%m).$(printf "%06d" "$CI_PIPELINE_IID")"; if [ "$CI_TAG_RESULT" = "fail" ]; then TAG="${TAG}-fail"; fi; export TAG'
    - git tag "$TAG" "$CI_COMMIT_SHA"
    - git push origin "refs/tags/$TAG"

ci-tag-green:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: pass
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success

ci-tag-red:
  extends: .ci-tag
  variables:
    CI_TAG_RESULT: fail
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_failure
